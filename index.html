<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>ACK OPS - Selfie Absensi</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f4f6;

      color: #111;

    }


    .container {

      max-width: 450px;

      margin: auto;

    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.08);

    }


    .header {

      text-align: center;

      margin-bottom: 20px;

    }


    .logo {

      font-size: 28px;

      font-weight: bold;

    }


    .subtitle {

      color: #777;

      margin-top: 5px;

      font-size: 14px;

    }


    .user-info {

      background: #f8f8f8;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 15px;

      text-align: center;

      font-size: 14px;

      line-height: 1.6;

    }


    .camera {

      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

    }


    video {

      width: 100%;

      display: block;

      aspect-ratio: 3 / 4;

      object-fit: cover;

      transform: scaleX(-1);

      background: #000;

    }


    canvas {

      display: none;

    }


    #preview {

      width: 100%;

      display: none;

      aspect-ratio: 3 / 4;

      object-fit: cover;

      border-radius: 16px;

      transform: scaleX(-1);

      background: #000;

    }


    .status {

      margin-top: 15px;

      padding: 14px;

      border-radius: 12px;

      background: #f8f8f8;

      text-align: center;

      line-height: 1.6;

      font-size: 14px;

    }


    .success {

      background: #ecfdf3;

      color: #166534;

    }


    .danger {

      background: #fef2f2;

      color: #991b1b;

    }


    .warning {

      background: #fff7ed;

      color: #9a3412;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 12px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #aaa;

      cursor: not-allowed;

    }


    .secondary {

      background: #e5e7eb;

      color: #111;

    }


    .camera-guide {

      text-align: center;

      color: #777;

      font-size: 13px;

      margin-top: 10px;

      line-height: 1.5;

    }


    .hidden {

      display: none !important;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">


    <!-- =============================================
         HEADER
    ============================================== -->

    <div class="header">

      <div class="logo">

        ACK OPS

      </div>

      <div class="subtitle">

        Selfie Absensi

      </div>

    </div>



    <!-- =============================================
         USER INFO
    ============================================== -->

    <div
      id="userInfo"
      class="user-info">

      Menyiapkan kamera...

    </div>



    <!-- =============================================
         CAMERA
    ============================================== -->

    <div
      id="cameraArea"
      class="camera">

      <video
        id="video"
        autoplay
        playsinline>
      </video>

    </div>



    <!-- =============================================
         PHOTO PREVIEW
    ============================================== -->

    <img
      id="preview"
      alt="Preview Selfie">



    <canvas
      id="canvas">
    </canvas>



    <!-- =============================================
         GUIDE
    ============================================== -->

    <div
      id="cameraGuide"
      class="camera-guide">

      Pastikan wajah terlihat jelas
      dan tidak tertutup.

    </div>



    <!-- =============================================
         STATUS
    ============================================== -->

    <div
      id="status"
      class="status">

      Meminta akses kamera...

    </div>



    <!-- =============================================
         START CAMERA
    ============================================== -->

    <button
      id="startButton"
      onclick="startCamera()"
      class="hidden">

      📷 BUKA KAMERA

    </button>



    <!-- =============================================
         CAPTURE
    ============================================== -->

    <button
      id="captureButton"
      onclick="capturePhoto()"
      class="hidden">

      📸 AMBIL FOTO

    </button>



    <!-- =============================================
         RETAKE
    ============================================== -->

    <button
      id="retakeButton"
      onclick="retakePhoto()"
      class="secondary hidden">

      🔄 ULANGI FOTO

    </button>



    <!-- =============================================
         USE PHOTO
    ============================================== -->

    <button
      id="useButton"
      onclick="usePhoto()"
      class="hidden">

      ✓ GUNAKAN FOTO

    </button>


  </div>


</div>



<script>


/* =====================================================
   GLOBAL
===================================================== */

let stream = null;

let photoData = null;



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {


    /*
     * Ambil nama dan toko
     * dari parameter URL.
     *
     * Contoh:
     *
     * ?nama=Andi&toko=DTOP%20Sukabumi
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const nama =
      params.get('nama');


    const toko =
      params.get('toko');


    const userInfo =
      document.getElementById(
        'userInfo'
      );


    if (nama || toko) {


      userInfo.innerHTML = `

        <b>
          ${escapeHtml(
            nama || ''
          )}
        </b>

        <br>

        ${escapeHtml(
          toko || ''
        )}

      `;

    }

    else {


      userInfo.innerText =
        'Selfie untuk absensi';

    }


    /*
     * Coba langsung buka kamera.
     */

    startCamera();

  }
);



/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  const status =
    document.getElementById(
      'status'
    );


  const startButton =
    document.getElementById(
      'startButton'
    );


  const captureButton =
    document.getElementById(
      'captureButton'
    );


  const video =
    document.getElementById(
      'video'
    );


  try {


    /*
     * Cek dukungan kamera.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {


      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );

    }



    status.className =
      'status';


    status.innerText =
      'Meminta izin kamera...';


    startButton
      .classList
      .add('hidden');


    captureButton
      .classList
      .add('hidden');



    /*
     * Jika kamera sebelumnya masih aktif,
     * matikan terlebih dahulu.
     */

    stopCamera();



    /*
     * Minta kamera depan.
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'user'
            },

            width: {
              ideal: 720
            },

            height: {
              ideal: 960
            }

          },

          audio: false

        });



    /*
     * Hubungkan kamera ke video.
     */

    video.srcObject =
      stream;


    await video.play();



    /*
     * Kamera berhasil.
     */

    status.className =
      'status success';


    status.innerHTML = `

      ✅ <b>KAMERA AKTIF</b>

      <br>

      Pastikan wajah terlihat jelas.

    `;


    captureButton
      .classList
      .remove('hidden');

  }


  catch(error) {


    console.error(
      'Camera error:',
      error
    );


    status.className =
      'status danger';


    status.innerHTML = `

      ❌ <b>KAMERA TIDAK DAPAT DIBUKA</b>

      <br><br>

      ${getCameraError(
        error
      )}

    `;


    startButton
      .classList
      .remove('hidden');


    captureButton
      .classList
      .add('hidden');

  }

}



/* =====================================================
   CAPTURE PHOTO
===================================================== */

function capturePhoto() {


  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const preview =
    document.getElementById(
      'preview'
    );


  const captureButton =
    document.getElementById(
      'captureButton'
    );


  const retakeButton =
    document.getElementById(
      'retakeButton'
    );


  const useButton =
    document.getElementById(
      'useButton'
    );


  const guide =
    document.getElementById(
      'cameraGuide'
    );


  const status =
    document.getElementById(
      'status'
    );



  /*
   * Pastikan video sudah memiliki frame.
   */

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {


    alert(
      'Kamera belum siap. Tunggu sebentar lalu coba lagi.'
    );


    return;

  }



  /*
   * Samakan ukuran canvas
   * dengan kamera.
   */

  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;



  const context =
    canvas.getContext(
      '2d'
    );



  /*
   * Mirror foto agar sama
   * seperti preview selfie.
   */

  context.save();


  context.translate(
    canvas.width,
    0
  );


  context.scale(
    -1,
    1
  );


  context.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  context.restore();



  /*
   * Convert menjadi JPEG.
   */

  photoData =
    canvas.toDataURL(
      'image/jpeg',
      0.85
    );



  /*
   * Tampilkan preview.
   */

  preview.src =
    photoData;


  document
    .getElementById(
      'cameraArea'
    )
    .style.display =
    'none';


  preview.style.display =
    'block';



  /*
   * Tombol.
   */

  captureButton
    .classList
    .add('hidden');


  retakeButton
    .classList
    .remove('hidden');


  useButton
    .classList
    .remove('hidden');



  guide.innerText =
    'Periksa foto. Jika sudah sesuai, klik GUNAKAN FOTO.';


  status.className =
    'status';


  status.innerText =
    'Foto berhasil diambil.';



  /*
   * Kamera tidak perlu tetap aktif
   * setelah foto diambil.
   */

  stopCamera();

}



/* =====================================================
   RETAKE PHOTO
===================================================== */

function retakePhoto() {


  photoData =
    null;



  const cameraArea =
    document.getElementById(
      'cameraArea'
    );


  const preview =
    document.getElementById(
      'preview'
    );


  const captureButton =
    document.getElementById(
      'captureButton'
    );


  const retakeButton =
    document.getElementById(
      'retakeButton'
    );


  const useButton =
    document.getElementById(
      'useButton'
    );


  const guide =
    document.getElementById(
      'cameraGuide'
    );


  const status =
    document.getElementById(
      'status'
    );



  /*
   * Tampilkan kamera kembali.
   */

  cameraArea.style.display =
    'block';


  preview.style.display =
    'none';



  /*
   * Reset tombol.
   */

  captureButton
    .classList
    .add('hidden');


  retakeButton
    .classList
    .add('hidden');


  useButton
    .classList
    .add('hidden');



  guide.innerText =
    'Pastikan wajah terlihat jelas dan tidak tertutup.';



  status.className =
    'status';


  status.innerText =
    'Menyiapkan kamera...';



  /*
   * Buka kamera lagi.
   */

  startCamera();

}



/* =====================================================
   USE PHOTO
===================================================== */

function usePhoto() {


  if (!photoData) {


    alert(
      'Foto belum tersedia.'
    );


    return;

  }



  const status =
    document.getElementById(
      'status'
    );


  const retakeButton =
    document.getElementById(
      'retakeButton'
    );


  const useButton =
    document.getElementById(
      'useButton'
    );


  status.className =
    'status';


  status.innerHTML = `

    ⏳ <b>MENGIRIM FOTO...</b>

    <br><br>

    Mohon tunggu.

  `;


  retakeButton
    .classList
    .add('hidden');


  useButton
    .classList
    .add('hidden');



  /*
   * Cek apakah halaman ini
   * dibuka oleh ACK OPS.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {


    try {


      /*
       * Kirim foto ke ACK OPS.
       */

      window.opener.postMessage(

        {

          type:
            'ACK_OPS_ATTENDANCE_PHOTO',

          photo:
            photoData

        },

        '*'

      );


      /*
       * Tampilkan status.
       */

      status.className =
        'status success';


      status.innerHTML = `

        ✅ <b>FOTO TERKIRIM</b>

        <br><br>

        Data sedang diproses
        oleh ACK OPS.

      `;


      /*
       * Tunggu sebentar kemudian
       * tutup halaman kamera.
       */

      setTimeout(

        function() {

          window.close();

        },

        1200

      );

    }


    catch(error) {


      console.error(
        error
      );


      showSendError();

    }

  }

  else {


    /*
     * Tidak ada parent window.
     */

    showSendError();

  }

}



/* =====================================================
   SEND ERROR
===================================================== */

function showSendError() {


  const status =
    document.getElementById(
      'status'
    );


  const retakeButton =
    document.getElementById(
      'retakeButton'
    );


  const useButton =
    document.getElementById(
      'useButton'
    );


  status.className =
    'status danger';


  status.innerHTML = `

    ❌ <b>SISTEM TIDAK TERHUBUNG</b>

    <br><br>

    Halaman kamera tidak menemukan
    halaman ACK OPS.

    <br><br>

    Silakan kembali ke ACK OPS
    dan lakukan CLOCK IN lagi.

  `;


  retakeButton
    .classList
    .remove('hidden');


  useButton
    .classList
    .remove('hidden');

}



/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {


  if (!stream) {

    return;

  }


  stream
    .getTracks()
    .forEach(

      function(track) {

        track.stop();

      }

    );


  stream =
    null;



  const video =
    document.getElementById(
      'video'
    );


  if (video) {

    video.srcObject =
      null;

  }

}



/* =====================================================
   CAMERA ERROR
===================================================== */

function getCameraError(error) {


  if (
    error.name ===
    'NotAllowedError'
  ) {


    return `

      Akses kamera ditolak.

      <br><br>

      Silakan izinkan kamera
      untuk website ini melalui
      pengaturan browser.

    `;

  }



  if (
    error.name ===
    'PermissionDeniedError'
  ) {


    return `

      Izin kamera ditolak.

      <br><br>

      Silakan izinkan akses kamera
      kemudian coba lagi.

    `;

  }



  if (
    error.name ===
    'NotFoundError'
  ) {


    return `

      Kamera tidak ditemukan
      pada perangkat ini.

    `;

  }



  if (
    error.name ===
    'NotReadableError'
  ) {


    return `

      Kamera sedang digunakan
      oleh aplikasi lain.

      <br><br>

      Tutup aplikasi lain yang
      sedang menggunakan kamera.

    `;

  }



  if (
    error.name ===
    'SecurityError'
  ) {


    return `

      Browser memblokir akses kamera
      karena alasan keamanan.

      <br><br>

      Pastikan halaman dibuka
      menggunakan HTTPS.

    `;

  }



  if (
    error.name ===
    'TypeError'
  ) {


    return `

      Browser tidak dapat mengakses
      kamera.

      <br><br>

      Pastikan menggunakan browser
      versi terbaru dan halaman
      dibuka melalui HTTPS.

    `;

  }



  return `

    ${escapeHtml(
      error.message ||
      'Terjadi kesalahan saat membuka kamera.'
    )}

  `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {


  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}



/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopCamera();

  }
);


</script>


</body>

</html>
