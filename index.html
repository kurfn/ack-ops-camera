<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>ACK OPS Camera</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f3f4f6;

      color: #111;

    }


    .container {

      max-width: 450px;

      margin: auto;

    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);

    }


    .header {

      text-align: center;

      margin-bottom: 18px;

    }


    .logo {

      font-size: 28px;

      font-weight: bold;

    }


    .subtitle {

      color: #777;

      font-size: 14px;

      margin-top: 5px;

    }


    .user-info {

      background: #f8f8f8;

      padding: 14px;

      border-radius: 12px;

      text-align: center;

      line-height: 1.6;

      font-size: 14px;

      margin-bottom: 15px;

    }


    .camera {

      background: #000;

      border-radius: 16px;

      overflow: hidden;

    }


    video,
    #preview {

      width: 100%;

      aspect-ratio: 3 / 4;

      object-fit: cover;

      display: block;

    }


    video {

      transform:
        scaleX(-1);

    }


    #preview {

      display: none;

    }


    canvas {

      display: none;

    }


    .status {

      margin-top: 15px;

      padding: 14px;

      border-radius: 12px;

      background: #f8f8f8;

      text-align: center;

      line-height: 1.6;

    }


    .success {

      background: #ecfdf3;

      color: #166534;

    }


    .danger {

      background: #fef2f2;

      color: #991b1b;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 12px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: bold;

    }


    .secondary {

      background: #e5e7eb;

      color: #111;

    }


    .hidden {

      display: none !important;

    }

  </style>

</head>


<body>


<div class="container">


<div class="card">


  <div class="header">

    <div class="logo">

      ACK OPS

    </div>

    <div class="subtitle">

      Selfie Absensi

    </div>

  </div>



  <div
    id="userInfo"
    class="user-info">

    Menyiapkan kamera...

  </div>



  <div
    id="cameraArea"
    class="camera">

    <video
      id="video"
      autoplay
      playsinline>

    </video>


    <img
      id="preview"
      alt="Preview Selfie">

  </div>



  <canvas
    id="canvas">

  </canvas>



  <div
    id="status"
    class="status">

    Meminta akses kamera...

  </div>



  <button
    id="captureButton"
    onclick="capturePhoto()"
    class="hidden">

    📸 AMBIL FOTO

  </button>



  <button
    id="retakeButton"
    onclick="retakePhoto()"
    class="secondary hidden">

    🔄 ULANGI FOTO

  </button>



  <button
    id="useButton"
    onclick="usePhoto()"
    class="hidden">

    ✓ GUNAKAN FOTO

  </button>


</div>


</div>



<script>


/* =====================================================
   GLOBAL
===================================================== */

let stream =
  null;


let photoData =
  null;



/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {


    const params =
      new URLSearchParams(
        window.location.search
      );


    const nama =
      params.get('nama')
      || '';


    const lokasi =
      params.get('lokasi')
      || '';


    const tipe =
      params.get('tipe')
      || '';


    const shift =
      params.get('shift')
      || '';


    document
      .getElementById(
        'userInfo'
      )
      .innerHTML = `

        <b>
          ${escapeHtml(nama)}
        </b>

        <br>

        ${escapeHtml(lokasi)}

        <br>

        ${escapeHtml(tipe)}
        ${shift
          ? ' • ' +
            escapeHtml(shift)
          : ''
        }

      `;


    startCamera();

  }
);



/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  const status =
    document.getElementById(
      'status'
    );


  const capture =
    document.getElementById(
      'captureButton'
    );


  try {


    if (
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    status.innerText =
      'Meminta izin kamera...';


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'user'
            },

            width: {
              ideal: 720
            },

            height: {
              ideal: 960
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      stream;


    await video.play();


    status.className =
      'status success';


    status.innerHTML = `

      ✅ <b>KAMERA AKTIF</b>

      <br>

      Pastikan wajah terlihat jelas.

    `;


    capture
      .classList
      .remove('hidden');

  }


  catch(error) {


    status.className =
      'status danger';


    status.innerHTML = `

      ❌ <b>KAMERA TIDAK DAPAT DIBUKA</b>

      <br><br>

      ${getCameraError(
        error
      )}

    `;

  }

}



/* =====================================================
   CAPTURE
===================================================== */

function capturePhoto() {


  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const preview =
    document.getElementById(
      'preview'
    );


  if (
    !video.videoWidth
    ||
    !video.videoHeight
  ) {

    alert(
      'Kamera belum siap.'
    );

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie.
   */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  ctx.restore();



  /*
   * WATERMARK
   */

  drawWatermark(
    ctx,
    canvas
  );



  photoData =
    canvas.toDataURL(
      'image/jpeg',
      0.85
    );


  preview.src =
    photoData;


  document
    .getElementById(
      'cameraArea'
    )
    .querySelector(
      'video'
    )
    .style.display =
    'none';


  preview.style.display =
    'block';


  document
    .getElementById(
      'captureButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'retakeButton'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'useButton'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'status'
    )
    .innerText =
    'Periksa foto sebelum digunakan.';


  stopCamera();

}



/* =====================================================
   WATERMARK
===================================================== */

function drawWatermark(
  ctx,
  canvas
) {


  const params =
    new URLSearchParams(
      window.location.search
    );


  const nama =
    params.get('nama')
    || '';


  const lokasi =
    params.get('lokasi')
    || '';


  const tipe =
    params.get('tipe')
    || '';


  const timestamp =
    Number(
      params.get(
        'timestamp'
      )
    );


  const status =
    params.get('status')
    || '';


  const terlambat =
    Number(
      params.get(
        'terlambat'
      )
    )
    || 0;


  const jarak =
    params.get('jarak')
    || '';


  const date =
    timestamp
      ?
      new Date(timestamp)
      :
      new Date();


  const tanggal =
    formatDate(
      date
    );


  let statusText =
    status;


  if (
    status ===
    'TERLAMBAT'
  ) {

    statusText =
      'TERLAMBAT ' +
      terlambat +
      ' MENIT';

  }


  if (
    status ===
    'ONTIME'
  ) {

    statusText =
      'ONTIME';

  }


  if (
    status ===
    'PULANG'
  ) {

    statusText =
      'CLOCK OUT';

  }



  /*
   * Tinggi watermark.
   */

  const boxHeight =
    canvas.height *
    0.18;


  const y =
    canvas.height -
    boxHeight;


  /*
   * Background hitam transparan.
   */

  ctx.save();


  ctx.fillStyle =
    'rgba(0,0,0,0.72)';


  ctx.fillRect(

    0,

    y,

    canvas.width,

    boxHeight

  );


  /*
   * Text.
   */

  ctx.fillStyle =
    '#ffffff';


  ctx.font =
    'bold ' +
    Math.max(
      18,
      canvas.width * 0.035
    )
    +
    'px Arial';


  ctx.fillText(

    'ACK OPS',

    canvas.width * 0.04,

    y +
    boxHeight * 0.23

  );


  ctx.font =
    Math.max(
      15,
      canvas.width * 0.028
    )
    +
    'px Arial';


  ctx.fillText(

    nama,

    canvas.width * 0.04,

    y +
    boxHeight * 0.43

  );


  ctx.fillText(

    tanggal,

    canvas.width * 0.04,

    y +
    boxHeight * 0.61

  );


  ctx.fillText(

    tipe +
    ' • ' +
    statusText,

    canvas.width * 0.04,

    y +
    boxHeight * 0.78

  );


  ctx.fillText(

    lokasi +
    ' • ' +
    jarak +
    ' meter',

    canvas.width * 0.04,

    y +
    boxHeight * 0.94

  );


  ctx.restore();

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  date
) {


  const d =
    String(
      date.getDate()
    )
      .padStart(
        2,
        '0'
      );


  const m =
    String(
      date.getMonth() + 1
    )
      .padStart(
        2,
        '0'
      );


  const y =
    date.getFullYear();


  const h =
    String(
      date.getHours()
    )
      .padStart(
        2,
        '0'
      );


  const min =
    String(
      date.getMinutes()
    )
      .padStart(
        2,
        '0'
      );


  const sec =
    String(
      date.getSeconds()
    )
      .padStart(
        2,
        '0'
      );


  return (
    d +
    '/' +
    m +
    '/' +
    y +
    ' ' +
    h +
    ':' +
    min +
    ':' +
    sec
  );

}



/* =====================================================
   RETAKE
===================================================== */

function retakePhoto() {


  photoData =
    null;


  const video =
    document.getElementById(
      'video'
    );


  const preview =
    document.getElementById(
      'preview'
    );


  video.style.display =
    'block';


  preview.style.display =
    'none';


  document
    .getElementById(
      'retakeButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'useButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'captureButton'
    )
    .classList
    .add('hidden');


  startCamera();

}



/* =====================================================
   USE PHOTO
===================================================== */

function usePhoto() {


  if (!photoData) {

    return;

  }


  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status';


  status.innerHTML = `

    ⏳ <b>MENGIRIM FOTO...</b>

    <br><br>

    Mohon tunggu.

  `;


  document
    .getElementById(
      'retakeButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'useButton'
    )
    .classList
    .add('hidden');


  if (
    window.opener
    &&
    !window.opener.closed
  ) {


    window.opener.postMessage(

      {

        type:
          'ACK_OPS_ATTENDANCE_PHOTO',

        photo:
          photoData

      },

      'https://script.google.com'

    );


    /*
     * Untuk Apps Script,
     * origin bisa berbeda pada
     * deployment tertentu.
     *
     * Parent tetap memvalidasi
     * event.origin = GitHub.
     */

    status.className =
      'status success';


    status.innerHTML = `

      ✅ <b>FOTO TERKIRIM</b>

      <br><br>

      Kembali ke ACK OPS...

    `;


    setTimeout(

      function() {

        window.close();

      },

      1000

    );

  }

  else {


    status.className =
      'status danger';


    status.innerHTML = `

      ❌ Halaman ACK OPS tidak ditemukan.

    `;

  }

}



/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {


  if (!stream) {

    return;

  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream =
    null;

}



/* =====================================================
   CAMERA ERROR
===================================================== */

function getCameraError(
  error
) {


  if (
    error.name ===
    'NotAllowedError'
  ) {

    return `
      Akses kamera ditolak.
      <br><br>
      Izinkan kamera pada browser.
    `;

  }


  if (
    error.name ===
    'NotFoundError'
  ) {

    return `
      Kamera tidak ditemukan.
    `;

  }


  if (
    error.name ===
    'NotReadableError'
  ) {

    return `
      Kamera sedang digunakan aplikasi lain.
    `;

  }


  return `
    ${escapeHtml(
      error.message
      ||
      'Terjadi kesalahan kamera.'
    )}
  `;

}



/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}



/* =====================================================
   BEFORE CLOSE
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopCamera();

  }
);

</script>


</body>

</html>
