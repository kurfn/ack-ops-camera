<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACK OPS Camera</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

    }


    .container {

      width: 100%;

      max-width: 480px;

      margin: auto;

      min-height: 100vh;

      padding: 15px;

    }


    video {

      width: 100%;

      border-radius: 18px;

      background: black;

    }


    canvas {

      display: none;

    }


    #preview {

      width: 100%;

      border-radius: 18px;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      margin-top: 12px;

      font-size: 16px;

      font-weight: bold;

    }


    .capture {

      background: white;

      color: black;

    }


    .send {

      background: #2e7d32;

      color: white;

    }


    .retry {

      background: #555;

      color: white;

    }


    .info {

      text-align: center;

      padding: 12px 0;

      line-height: 1.5;

      font-size: 14px;

    }


    .hidden {

      display: none;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="info">

    <strong>ACK OPS</strong><br>

    Ambil foto selfie untuk absensi.

  </div>


  <video
    id="video"
    autoplay
    playsinline
  ></video>


  <canvas id="canvas"></canvas>


  <img
    id="preview"
    class="hidden"
  >


  <button
    id="captureButton"
    class="capture"
    onclick="capturePhoto()"
  >
    Ambil Foto
  </button>


  <button
    id="retryButton"
    class="retry hidden"
    onclick="retakePhoto()"
  >
    Ambil Ulang
  </button>


  <button
    id="sendButton"
    class="send hidden"
    onclick="sendPhoto()"
  >
    Gunakan Foto
  </button>


  <div
    id="status"
    class="info"
  >
    Membuka kamera...
  </div>


</div>



<script>


/* =================================================
   PARAMETER
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const nama =
  params.get('nama') || '';


const kategori =
  params.get('kategori') || '';


const lokasi =
  params.get('lokasi') || '';


const tipe =
  params.get('tipe') || '';


const status =
  params.get('status') || '';


const terlambat =
  params.get('terlambat') || '0';


const jarak =
  params.get('jarak') || '';


const timestamp =
  Number(
    params.get('timestamp') ||
    Date.now()
  );



/* =================================================
   CAMERA
================================================= */

let stream = null;

let capturedPhoto = null;



window.addEventListener(
  'load',
  function() {

    startCamera();

  }
);



async function startCamera() {

  const video =
    document.getElementById(
      'video'
    );


  const statusBox =
    document.getElementById(
      'status'
    );


  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: 'user'
          },

          audio: false

        });


    video.srcObject =
      stream;


    statusBox.innerText =
      'Pastikan wajah terlihat jelas sebelum mengambil foto.';

  }

  catch (error) {

    statusBox.innerText =
      'Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.';

  }

}



/* =================================================
   CAPTURE
================================================= */

function capturePhoto() {

  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    return;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie
   */

  ctx.save();

  ctx.translate(
    width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  /*
   * WATERMARK
   */

  drawWatermark(
    ctx,
    width,
    height
  );


  capturedPhoto =
    canvas.toDataURL(
      'image/jpeg',
      0.88
    );


  const preview =
    document.getElementById(
      'preview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retryButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Periksa foto sebelum digunakan.';

}



/* =================================================
   WATERMARK
================================================= */

function drawWatermark(
  ctx,
  width,
  height
) {

  const boxHeight =
    Math.min(
      180,
      height * 0.25
    );


  /*
   * Background transparan
   */

  ctx.fillStyle =
    'rgba(0,0,0,0.70)';


  ctx.fillRect(
    0,
    height - boxHeight,
    width,
    boxHeight
  );


  /*
   * Font
   */

  const titleSize =
    Math.max(
      22,
      width * 0.045
    );


  const textSize =
    Math.max(
      16,
      width * 0.032
    );


  ctx.fillStyle =
    '#ffffff';


  ctx.font =
    'bold ' +
    titleSize +
    'px Arial';


  let y =
    height -
    boxHeight +
    titleSize +
    10;


  ctx.fillText(
    'ACK OPS',
    20,
    y
  );


  ctx.font =
    textSize +
    'px Arial';


  y +=
    textSize +
    10;


  ctx.fillText(
    nama,
    20,
    y
  );


  /*
   * Timestamp
   */

  y +=
    textSize +
    7;


  const date =
    new Date(timestamp);


  const formatted =
    date.toLocaleString(
      'id-ID',
      {
        dateStyle: 'medium',
        timeStyle: 'medium'
      }
    );


  ctx.fillText(
    formatted,
    20,
    y
  );


  /*
   * STATUS
   */

  y +=
    textSize +
    7;


  let statusText =
    'STATUS: ';


  if (
    status ===
    'TERLAMBAT'
  ) {

    statusText +=
      'TERLAMBAT ' +
      terlambat +
      ' MENIT';

  }

  else if (
    status ===
    'ONTIME'
  ) {

    statusText +=
      'TEPAT WAKTU';

  }

  else {

    statusText +=
      status;

  }


  ctx.fillText(
    statusText,
    20,
    y
  );


  /*
   * LOCATION
   */

  y +=
    textSize +
    7;


  ctx.fillText(
    'LOKASI: ' +
    lokasi +
    ' | JARAK: ' +
    jarak +
    ' m',
    20,
    y
  );

}



/* =================================================
   RETAKE
================================================= */

function retakePhoto() {

  capturedPhoto =
    null;


  document
    .getElementById(
      'preview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'video'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retryButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Silakan ambil foto kembali.';

}



/* =================================================
   SEND PHOTO
================================================= */

function sendPhoto() {

  if (!capturedPhoto) {

    return;

  }


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Mengirim foto...';


  /*
   * Kirim ke Apps Script parent.
   *
   * Target "*" sengaja digunakan karena
   * Apps Script Web App dapat memiliki origin
   * berbeda tergantung deployment.
   *
   * Parent tetap memverifikasi bahwa pengirim
   * berasal dari kurfn.github.io.
   */

  if (
    window.opener
  ) {

    window.opener.postMessage(

      {
        type:
          'ACK_OPS_PHOTO',

        photo:
          capturedPhoto

      },

      '*'

    );


    /*
     * Tutup popup
     */

    setTimeout(
      function() {

        window.close();

      },
      500
    );

  }

}



/* =================================================
   STOP CAMERA
================================================= */

window.addEventListener(
  'beforeunload',
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);


</script>

</body>

</html>
