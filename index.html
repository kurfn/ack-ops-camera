<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ACK OPS Camera</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      width: 100%;
      min-height: 100%;

      margin: 0;

      background: #111;

      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      overflow-x: hidden;

    }


    body {

      min-height: 100vh;
      min-height: 100dvh;

    }


    .container {

      width: 100%;

      max-width: 600px;

      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;

      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(16px, env(safe-area-inset-bottom))
        12px;

      display: flex;

      flex-direction: column;

    }


    .info {

      flex-shrink: 0;

      text-align: center;

      padding: 8px 4px 12px;

      line-height: 1.45;

      font-size: 14px;

    }


    .camera-wrapper {

      width: 100%;

      position: relative;

      overflow: hidden;

      border-radius: 18px;

      background: #000;

    }


    video {

      display: block;

      width: 100%;

      height: auto;

      aspect-ratio: 3 / 4;

      object-fit: cover;

      background: #000;

    }


    #preview {

      display: block;

      width: 100%;

      height: auto;

      aspect-ratio: 3 / 4;

      object-fit: cover;

      border-radius: 18px;

      background: #000;

    }


    canvas {

      display: none;

    }


    .actions {

      width: 100%;

      margin-top: 8px;

    }


    button {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 100%;

      min-height: 52px;

      border: 0;

      border-radius: 14px;

      padding: 14px 16px;

      margin-top: 10px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      touch-action: manipulation;

    }


    button:active {

      transform: scale(.98);

    }


    .capture {

      background: white;

      color: #111;

    }


    .send {

      background: #2e7d32;

      color: white;

    }


    .retry {

      background: #555;

      color: white;

    }


    .hidden {

      display: none !important;

    }


    @media (min-width: 600px) {

      .container {

        padding-left: 20px;

        padding-right: 20px;

      }

    }


    @media (max-width: 360px) {

      .container {

        padding-left: 8px;

        padding-right: 8px;

      }

      video,
      #preview {

        border-radius: 14px;

      }

      button {

        min-height: 50px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="info">

    <strong>ACK OPS</strong><br>

    Ambil foto selfie untuk absensi.

  </div>


  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <img
      id="preview"
      class="hidden"
    >

  </div>


  <canvas id="canvas"></canvas>


  <div class="actions">

    <button
      id="captureButton"
      class="capture"
      onclick="capturePhoto()"
    >
      Ambil Foto
    </button>


    <button
      id="retryButton"
      class="retry hidden"
      onclick="retakePhoto()"
    >
      Ambil Ulang
    </button>


    <button
      id="sendButton"
      class="send hidden"
      onclick="sendPhoto()"
    >
      Gunakan Foto
    </button>

  </div>


  <div
    id="status"
    class="info"
  >
    Membuka kamera...
  </div>


</div>


<script>


/* =================================================
   PARAMETER
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const nama =
  params.get('nama') || '';


const kategori =
  params.get('kategori') || '';


const lokasi =
  params.get('lokasi') || '';


const tipe =
  params.get('tipe') || '';


const status =
  params.get('status') || '';


const terlambat =
  params.get('terlambat') || '0';


const jarak =
  params.get('jarak') || '';


const timestamp =
  Number(
    params.get('timestamp') ||
    Date.now()
  );


/* =================================================
   CAMERA
================================================= */

let stream = null;

let capturedPhoto = null;


window.addEventListener(
  'load',
  function() {

    startCamera();

  }
);


async function startCamera() {

  const video =
    document.getElementById(
      'video'
    );


  const statusBox =
    document.getElementById(
      'status'
    );


  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: 'user',

            width: {
              ideal: 1080
            },

            height: {
              ideal: 1440
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    statusBox.innerText =
      'Pastikan wajah terlihat jelas sebelum mengambil foto.';

  }

  catch (error) {

    statusBox.innerText =
      'Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.';

  }

}


/* =================================================
   CAPTURE
================================================= */

function capturePhoto() {

  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    return;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie
   */

  ctx.save();

  ctx.translate(
    width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  drawWatermark(
    ctx,
    width,
    height
  );


  capturedPhoto =
    canvas.toDataURL(
      'image/jpeg',
      0.88
    );


  const preview =
    document.getElementById(
      'preview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retryButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Periksa foto sebelum digunakan.';

}


/* =================================================
   WATERMARK
================================================= */

function drawWatermark(
  ctx,
  width,
  height
) {

  const boxHeight =
    Math.min(
      210,
      height * 0.25
    );


  ctx.fillStyle =
    'rgba(0,0,0,0.70)';


  ctx.fillRect(
    0,
    height - boxHeight,
    width,
    boxHeight
  );


  const titleSize =
    Math.max(
      22,
      width * 0.045
    );


  const textSize =
    Math.max(
      16,
      width * 0.032
    );


  ctx.fillStyle =
    '#ffffff';


  ctx.font =
    'bold ' +
    titleSize +
    'px Arial';


  let y =
    height -
    boxHeight +
    titleSize +
    10;


  ctx.fillText(
    'ACK OPS',
    20,
    y
  );


  ctx.font =
    textSize +
    'px Arial';


  y +=
    textSize +
    10;


  ctx.fillText(
    nama,
    20,
    y
  );


  y +=
    textSize +
    7;


  const date =
    new Date(timestamp);


  const formatted =
    date.toLocaleString(
      'id-ID',
      {
        dateStyle: 'medium',
        timeStyle: 'medium'
      }
    );


  ctx.fillText(
    formatted,
    20,
    y
  );


  y +=
    textSize +
    7;


  let statusText =
    'STATUS: ';


  if (
    status ===
    'TERLAMBAT'
  ) {

    statusText +=
      'TERLAMBAT ' +
      terlambat +
      ' MENIT';

  }

  else if (
    status ===
    'ONTIME'
  ) {

    statusText +=
      'TEPAT WAKTU';

  }

  else {

    statusText +=
      status;

  }


  ctx.fillText(
    statusText,
    20,
    y
  );


  y +=
    textSize +
    7;


  ctx.fillText(
    'LOKASI: ' +
    lokasi +
    ' | JARAK: ' +
    jarak +
    ' m',
    20,
    y
  );

}


/* =================================================
   RETAKE
================================================= */

function retakePhoto() {

  capturedPhoto =
    null;


  document
    .getElementById(
      'preview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'video'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'retryButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Silakan ambil foto kembali.';

}


/* =================================================
   SEND PHOTO
================================================= */

function sendPhoto() {

  if (!capturedPhoto) {

    return;

  }


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Mengirim foto...';


  if (
    window.opener
  ) {

    window.opener.postMessage(

      {
        type:
          'ACK_OPS_PHOTO',

        photo:
          capturedPhoto

      },

      '*'

    );


    setTimeout(
      function() {

        window.close();

      },
      500
    );

  }

}


/* =================================================
   STOP CAMERA
================================================= */

window.addEventListener(
  'beforeunload',
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

  }
);


</script>

</body>

</html>
