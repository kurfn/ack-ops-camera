<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACK OPS Camera</title>

  <!-- =================================================
     FACE RECOGNITION ENGINE - STEP 3A
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <!-- =================================================
       MEDIAPIPE FACE DETECTOR
  ================================================== -->

  <script type="module">

    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";


    window.ACKFaceDetector = FaceDetector;
    window.ACKFilesetResolver = FilesetResolver;

  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

    }


    .container {

      width: 100%;

      max-width: 480px;

      margin: auto;

      min-height: 100vh;

      padding: 15px;

    }


    video {

      width: 100%;

      border-radius: 18px;

      background: black;

    }


    canvas {

      display: none;

    }


    #preview {

      width: 100%;

      border-radius: 18px;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      margin-top: 12px;

      font-size: 16px;

      font-weight: bold;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    .capture {

      background: white;

      color: black;

    }


    .send {

      background: #2e7d32;

      color: white;

    }


    .retry {

      background: #555;

      color: white;

    }


    .info {

      text-align: center;

      padding: 12px 0;

      line-height: 1.5;

      font-size: 14px;

    }


    .hidden {

      display: none;

    }

  </style>

</head>


<body>


<div class="container">


  <div class="info">

    <strong>ACK OPS</strong><br>

<span id="cameraInstruction">
  Ambil foto selfie untuk absensi.
</span>

  </div>


  <video
    id="video"
    autoplay
    playsinline
  ></video>


  <canvas id="canvas"></canvas>


  <img
    id="preview"
    class="hidden"
  >


  <button
    id="captureButton"
    class="capture"
    onclick="capturePhoto()"
    disabled
  >
    Memuat kamera...
  </button>


  <button
    id="retryButton"
    class="retry hidden"
    onclick="retakePhoto()"
  >
    Ambil Ulang
  </button>


  <button
    id="sendButton"
    class="send hidden"
    onclick="sendPhoto()"
  >
    Gunakan Foto
  </button>


  <div
    id="status"
    class="info"
  >
    Menyiapkan kamera dan pemeriksaan wajah...
  </div>


</div>



<script>


/* =================================================
   PARAMETER
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const nama =
  params.get('nama') || '';

const cameraMode =
  params.get('mode') || '';
  if (
  cameraMode === 'REGISTER'
) {

  const instruction =
    document.getElementById(
      'cameraInstruction'
    );

  if (instruction) {
    instruction.innerText =
      'Registrasi wajah. Ambil 3 foto dengan posisi wajah yang jelas.';
  }
}

const kategori =
  params.get('kategori') || '';


const lokasi =
  params.get('lokasi') || '';


const tipe =
  params.get('tipe') || '';


const status =
  params.get('status') || '';


const terlambat =
  params.get('terlambat') || '0';


const jarak =
  params.get('jarak') || '';


const timestamp =
  Number(
    params.get('timestamp') ||
    Date.now()
  );


/* =================================================
   KONFIGURASI
================================================= */

const MAX_PHOTO_BYTES =
  30 * 1024;


/*
 * Minimal confidence deteksi wajah.
 *
 * 0.5 = cukup seimbang antara
 * sensitivitas dan ketepatan.
 */

const FACE_CONFIDENCE =
  0.5;

/* =================================================
   FACE RECOGNITION - STEP 3A
================================================= */

const FACE_RECOGNITION_MODEL_URL =
  'https://cdn.jsdelivr.net/gh/vladmandic/face-api@1.7.12/model';

let faceRecognitionReady =
  false;

/* =================================================
   CAMERA STATE
================================================= */

let stream = null;

let capturedPhoto = null;

let faceDetector = null;

let faceDetectorReady = false;

let registrationPhotos = [];


/* =================================================
   LOAD
================================================= */

window.addEventListener(
  'load',
  async function() {

    await startCamera();

    await initializeFaceDetector();

    await initializeFaceRecognition();

  }
);



/* =================================================
   CAMERA
================================================= */

async function startCamera() {

  const video =
    document.getElementById(
      'video'
    );


  const statusBox =
    document.getElementById(
      'status'
    );


  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: 'user'
          },

          audio: false

        });


    video.srcObject =
      stream;


    /*
     * Pastikan metadata video sudah siap.
     */

    await new Promise(
      function(resolve) {

        if (
          video.readyState >= 2
        ) {

          resolve();

          return;

        }


        video.onloadedmetadata =
          function() {

            resolve();

          };

      }
    );


    statusBox.innerText =
      'Kamera siap. Menyiapkan pemeriksaan wajah...';

  }

  catch (error) {

    console.error(
      'Camera error:',
      error
    );


    statusBox.innerText =
      'Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.';

  }

}



/* =================================================
   MEDIAPIPE FACE DETECTOR
================================================= */

async function initializeFaceDetector() {

  const statusBox =
    document.getElementById(
      'status'
    );


  const captureButton =
    document.getElementById(
      'captureButton'
    );


  try {

    statusBox.innerText =
      'Memuat AI pemeriksaan wajah...';


    /*
     * Tunggu module MediaPipe tersedia.
     *
     * Module dimuat secara asynchronous.
     */

    let attempts = 0;


    while (
      (
        !window.ACKFaceDetector ||
        !window.ACKFilesetResolver
      ) &&
      attempts < 100
    ) {

      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            100
          );

        }
      );


      attempts++;

    }


    if (
      !window.ACKFaceDetector ||
      !window.ACKFilesetResolver
    ) {

      throw new Error(
        'MediaPipe gagal dimuat.'
      );

    }


    const vision =
      await window.ACKFilesetResolver
        .forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
        );


    faceDetector =
      await window.ACKFaceDetector
        .createFromOptions(
          vision,
          {

            baseOptions: {

              modelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'

            },

            runningMode:
              'IMAGE',

            minDetectionConfidence:
              FACE_CONFIDENCE

          }
        );


    faceDetectorReady =
      true;


    captureButton.disabled =
      false;


    captureButton.innerText =
      'Ambil Foto';


    if (cameraMode === 'REGISTER') {

  statusBox.innerText =
    'Registrasi Face 1. Pastikan hanya satu wajah terlihat jelas.';

} else {

  statusBox.innerText =
    'Pastikan hanya satu wajah terlihat jelas sebelum mengambil foto.';

}

  }

  catch (error) {

    console.error(
      'Face detector error:',
      error
    );


    faceDetectorReady =
      false;


    captureButton.disabled =
      true;


    captureButton.innerText =
      'AI Wajah Tidak Siap';


    statusBox.innerText =
      'Pemeriksaan wajah gagal dimuat. Silakan buka ulang kamera.';

  }

}

/* =================================================
   LOAD FACE RECOGNITION
   STEP 3A
================================================= */

async function initializeFaceRecognition() {

  const statusBox =
    document.getElementById(
      'status'
    );

  try {

    statusBox.innerText =
      'Memuat AI pengenalan wajah...';

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      FACE_RECOGNITION_MODEL_URL
    );

    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
      FACE_RECOGNITION_MODEL_URL
    );

    await faceapi.nets.faceRecognitionNet.loadFromUri(
      FACE_RECOGNITION_MODEL_URL
    );

    faceRecognitionReady =
      true;

    console.log(
      'FACE RECOGNITION SIAP'
    );

    statusBox.innerText =
      'AI pengenalan wajah siap.';

  }
  catch (error) {

    faceRecognitionReady =
      false;

    console.error(
      'Face Recognition error:',
      error
    );

    statusBox.innerText =
      'AI pengenalan wajah gagal dimuat.';

  }
}

/* =================================================
   CAPTURE
================================================= */

async function capturePhoto() {

  if (
    !faceDetectorReady ||
    !faceDetector
  ) {

    return;

  }


  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const statusBox =
    document.getElementById(
      'status'
    );


  const captureButton =
    document.getElementById(
      'captureButton'
    );


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    statusBox.innerText =
      'Kamera belum siap. Silakan tunggu sebentar.';

    return;

  }


  /*
   * Disable tombol sementara
   * agar tidak double capture.
   */

  captureButton.disabled =
    true;


  statusBox.innerText =
    'Memeriksa wajah...';


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Mirror selfie.
   */

  ctx.save();


  ctx.translate(
    width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  /* =================================================
     FACE DETECTION
  ================================================= */

  let detectionResult;


  try {

    detectionResult =
      faceDetector.detect(
        canvas
      );

  }

  catch (error) {

    console.error(
      'Face detection error:',
      error
    );


    statusBox.innerText =
      'Pemeriksaan wajah gagal. Silakan coba lagi.';


    captureButton.disabled =
      false;


    return;

  }


  const detections =
    detectionResult &&
    detectionResult.detections
      ? detectionResult.detections
      : [];


  const faceCount =
    detections.length;


  console.log(
    'Jumlah wajah:',
    faceCount
  );


  /* =================================================
     0 WAJAH
  ================================================= */

  if (
    faceCount === 0
  ) {

    statusBox.innerText =
      'Wajah tidak terdeteksi. Pastikan wajah terlihat jelas lalu coba lagi.';


    captureButton.disabled =
      false;


    return;

  }


  /* =================================================
     LEBIH DARI 1 WAJAH
  ================================================= */

  if (
    faceCount > 1
  ) {

    statusBox.innerText =
      'Terdeteksi lebih dari satu wajah. Pastikan hanya satu orang di dalam foto.';


    captureButton.disabled =
      false;


    return;

  }

/* =================================================
   FACE REGISTRATION MODE
================================================= */

if (
  cameraMode === 'REGISTER'
) {

  await handleRegistrationCapture(
    canvas,
    statusBox,
    captureButton
  );

  return;
}

  /* =================================================
     SATU WAJAH
  ================================================= */

  statusBox.innerText =
    'Wajah terdeteksi. Memproses foto...';


  /*
   * WATERMARK
   */

  drawWatermark(
    ctx,
    width,
    height
  );


  /* =================================================
     COMPRESS MAX 30 KB
  ================================================= */

  let compressed;


  try {

    compressed =
      compressCanvasToMaxBytes(
        canvas,
        MAX_PHOTO_BYTES
      );

  }

  catch (error) {

    console.error(
      'Compression error:',
      error
    );


    statusBox.innerText =
      'Foto terlalu besar dan gagal dikompres. Silakan coba lagi.';


    captureButton.disabled =
      false;


    return;

  }


  if (
    !compressed ||
    !compressed.dataUrl
  ) {

    statusBox.innerText =
      'Foto gagal diproses. Silakan coba lagi.';


    captureButton.disabled =
      false;


    return;

  }


  capturedPhoto =
    compressed.dataUrl;


  console.log(
    'Final photo size:',
    compressed.bytes,
    'bytes'
  );


  /* =================================================
     PREVIEW
  ================================================= */

  const preview =
    document.getElementById(
      'preview'
    );


  preview.src =
    capturedPhoto;


  preview.classList.remove(
    'hidden'
  );


  video.classList.add(
    'hidden'
  );


  document
    .getElementById(
      'captureButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'retryButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.remove(
      'hidden'
    );


  statusBox.innerText =
    'Foto siap. Ukuran: ' +
    formatBytes(
      compressed.bytes
    ) +
    '. Periksa foto sebelum digunakan.';

}

/* =================================================
   FACE REGISTRATION CAPTURE - STEP 2C
================================================= */

async function handleRegistrationCapture(
  canvas,
  statusBox,
  captureButton
) {

  const currentNumber =
    registrationPhotos.length + 1;

  statusBox.innerText =
    'Memproses Face ' +
    currentNumber +
    '...';

   let compressed;

try {

  compressed =
    compressCanvasToMaxBytes(
      canvas,
      MAX_PHOTO_BYTES
    );

}

catch (error) {

  console.error(
    'Registration compression error:',
    error
  );

  statusBox.innerText =
    'Foto Face ' +
    currentNumber +
    ' gagal dikompres. Silakan coba lagi.';

  captureButton.disabled =
    false;

  return;
}

if (
  !compressed ||
  !compressed.dataUrl
) {

  statusBox.innerText =
    'Foto Face ' +
    currentNumber +
    ' gagal diproses. Silakan coba lagi.';

  captureButton.disabled =
    false;

  return;
}

registrationPhotos.push(
  compressed.dataUrl
);

console.log(
  'Registration Face ' +
  currentNumber +
  ' size:',
  compressed.bytes,
  'bytes'
);

  /*
   * Belum 3 foto
   */
  if (
    registrationPhotos.length < 3
  ) {

    const nextNumber =
      registrationPhotos.length + 1;

    statusBox.innerText =
      'Face ' +
      currentNumber +
      ' berhasil. Silakan ambil Face ' +
      nextNumber +
      '.';

    captureButton.disabled =
      false;

    return;
  }

  /*
   * Sudah 3 foto
   */
  statusBox.innerText =
    '3 foto wajah berhasil diambil. Memproses...';

  captureButton.classList.add(
    'hidden'
  );

  /*
   * Kirim ke parent Apps Script.
   * Belum disimpan ke FACE_DATA.
   */
  if (
    window.opener
  ) {

    window.opener.postMessage(
      {
        type:
          'ACK_OPS_FACE_REGISTRATION',

        nama:
          nama,

        face1:
          registrationPhotos[0],

        face2:
          registrationPhotos[1],

        face3:
          registrationPhotos[2]
      },
      '*'
    );

    setTimeout(
      function() {
        window.close();
      },
      500
    );

  }
}

/* =================================================
   WATERMARK
================================================= */

function drawWatermark(
  ctx,
  width,
  height
) {

  const boxHeight =
    Math.min(
      180,
      height * 0.25
    );


  /*
   * Background transparan
   */

  ctx.fillStyle =
    'rgba(0,0,0,0.70)';


  ctx.fillRect(
    0,
    height - boxHeight,
    width,
    boxHeight
  );


  /*
   * Font
   */

  const titleSize =
    Math.max(
      22,
      width * 0.045
    );


  const textSize =
    Math.max(
      16,
      width * 0.032
    );


  ctx.fillStyle =
    '#ffffff';


  ctx.font =
    'bold ' +
    titleSize +
    'px Arial';


  let y =
    height -
    boxHeight +
    titleSize +
    10;


  ctx.fillText(
    'ACK OPS',
    20,
    y
  );


  ctx.font =
    textSize +
    'px Arial';


  y +=
    textSize +
    10;


  ctx.fillText(
    nama,
    20,
    y
  );


  /*
   * Timestamp
   */

  y +=
    textSize +
    7;


  const date =
    new Date(timestamp);


  const formatted =
    date.toLocaleString(
      'id-ID',
      {
        dateStyle: 'medium',
        timeStyle: 'medium'
      }
    );


  ctx.fillText(
    formatted,
    20,
    y
  );


  /*
   * STATUS
   */

  y +=
    textSize +
    7;


  let statusText =
    'STATUS: ';


  if (
    status ===
    'TERLAMBAT'
  ) {

    statusText +=
      'TERLAMBAT ' +
      terlambat +
      ' MENIT';

  }

  else if (
    status ===
    'ONTIME'
  ) {

    statusText +=
      'TEPAT WAKTU';

  }

  else {

    statusText +=
      status;

  }


  ctx.fillText(
    statusText,
    20,
    y
  );


  /*
   * LOCATION
   */

  y +=
    textSize +
    7;


  ctx.fillText(
    'LOKASI: ' +
    lokasi +
    ' | JARAK: ' +
    jarak +
    ' m',
    20,
    y
  );

}



/* =================================================
   COMPRESS PHOTO
================================================= */

function compressCanvasToMaxBytes(
  sourceCanvas,
  maxBytes
) {

  /*
   * Kita mencoba beberapa kombinasi:
   *
   * 1. kualitas JPEG
   * 2. resolusi
   *
   * sampai ukuran benar-benar
   * <= 30 KB.
   */

  const originalWidth =
    sourceCanvas.width;


  const originalHeight =
    sourceCanvas.height;


  const workingCanvas =
    document.createElement(
      'canvas'
    );


  const workingCtx =
    workingCanvas.getContext(
      '2d'
    );


  /*
   * Mulai dari ukuran asli.
   */

  const scaleLevels = [

    1.00,

    0.90,

    0.80,

    0.70,

    0.60,

    0.50,

    0.40,

    0.35,

    0.30,

    0.25

  ];


  const qualityLevels = [

    0.88,

    0.82,

    0.76,

    0.70,

    0.64,

    0.58,

    0.52,

    0.46,

    0.40,

    0.34,

    0.28,

    0.22,

    0.18

  ];


  let bestResult =
    null;


  for (
    let s = 0;
    s < scaleLevels.length;
    s++
  ) {

    const scale =
      scaleLevels[s];


    const width =
      Math.max(
        1,
        Math.round(
          originalWidth *
          scale
        )
      );


    const height =
      Math.max(
        1,
        Math.round(
          originalHeight *
          scale
        )
      );


    workingCanvas.width =
      width;


    workingCanvas.height =
      height;


    workingCtx.clearRect(
      0,
      0,
      width,
      height
    );


    workingCtx.drawImage(
      sourceCanvas,
      0,
      0,
      width,
      height
    );


    for (
      let q = 0;
      q < qualityLevels.length;
      q++
    ) {

      const quality =
        qualityLevels[q];


      const dataUrl =
        workingCanvas.toDataURL(
          'image/jpeg',
          quality
        );


      const bytes =
        dataUrlToBytes(
          dataUrl
        );


      /*
       * Simpan hasil terkecil
       * sebagai fallback.
       */

      if (
        !bestResult ||
        bytes < bestResult.bytes
      ) {

        bestResult = {

          dataUrl:
            dataUrl,

          bytes:
            bytes

        };

      }


      /*
       * HARD LIMIT
       */

      if (
        bytes <= maxBytes
      ) {

        return {

          dataUrl:
            dataUrl,

          bytes:
            bytes

        };

      }

    }

  }


  /*
   * Kalau sampai sini berarti
   * belum berhasil mencapai limit.
   */

  throw new Error(
    'Tidak dapat mencapai ukuran maksimum 30 KB. Ukuran terkecil: ' +
    (
      bestResult
        ? bestResult.bytes
        : 0
    ) +
    ' bytes.'
  );

}



/* =================================================
   DATA URL → BYTES
================================================= */

function dataUrlToBytes(
  dataUrl
) {

  const base64 =
    dataUrl.split(
      ','
    )[1] || '';


  /*
   * Ukuran byte binary
   * dari Base64.
   */

  const padding =
    (
      base64.endsWith('==')
        ? 2
        : (
            base64.endsWith('=')
              ? 1
              : 0
          )
    );


  return Math.floor(
    base64.length *
    3 /
    4
  ) -
  padding;

}



/* =================================================
   FORMAT BYTES
================================================= */

function formatBytes(
  bytes
) {

  if (
    bytes < 1024
  ) {

    return (
      bytes +
      ' B'
    );

  }


  return (
    (bytes / 1024)
      .toFixed(1) +
    ' KB'
  );

}



/* =================================================
   RETAKE
================================================= */

function retakePhoto() {

  capturedPhoto =
    null;


  document
    .getElementById(
      'preview'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'video'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'captureButton'
    ).disabled =
      false;


  document
    .getElementById(
      'retryButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'sendButton'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Silakan ambil foto kembali.';

}



/* =================================================
   SEND PHOTO
================================================= */

function sendPhoto() {

  if (
    !capturedPhoto
  ) {

    return;

  }


  document
    .getElementById(
      'status'
    )
    .innerText =
      'Mengirim foto...';


  /*
   * Kirim ke Apps Script parent.
   *
   * Struktur ACK_OPS_PHOTO
   * TETAP SAMA dengan versi lama.
   */

  if (
    window.opener
  ) {

    window.opener.postMessage(

      {

        type:
          'ACK_OPS_PHOTO',

        photo:
          capturedPhoto

      },

      '*'

    );


    /*
     * Tutup popup
     */

    setTimeout(
      function() {

        window.close();

      },
      500
    );

  }

}



/* =================================================
   STOP CAMERA
================================================= */

window.addEventListener(
  'beforeunload',
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }


    if (
      faceDetector
    ) {

      try {

        faceDetector.close();

      }

      catch (error) {

        console.log(
          'Face detector close:',
          error
        );

      }

    }

  }
);


</script>
