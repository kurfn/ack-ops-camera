<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="../icon-192.png">

  <title>ACK OPS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.splash-logo {
  width: 96px;
  height: 96px;
  object-fit: contain;
  margin-bottom: 20px;
}

.splash-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #111111;
}

.splash-subtitle {
  margin-top: 6px;
  font-size: 13px;
  color: #777777;
}
  </style>
</head>

<body>
<div class="splash" id="splash">
  <div class="splash-content">

    <img
      class="splash-logo"
      src="../icon-192.png"
      alt="ACK OPS">

    <div class="splash-title">ACK OPS</div>

    <div class="splash-subtitle">Operational System</div>

  </div>
</div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyAgU_mrb5PFtZb9eaTSFzo_7w1OK5mbTRteXTRW6BbcqpRY7i7sr7qOR5Mbj3Gb8o4Tg/exec"
    allow="camera *; geolocation *"
    allowfullscreen>
  </iframe>
  <script>
  // ============================================
  // ACK OPS - GPS BRIDGE
  // Meminta GPS dari PWA top-level
  // lalu mengirim koordinat ke iframe ACK OPS.
  // ============================================

  let gpsWatchId = null;

  function startPwaGps() {
    if (!('geolocation' in navigator)) {
      console.error('GPS tidak tersedia di browser.');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position) {
        const gps = {
          type: 'ACK_OPS_GPS',
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy,
          timestamp: position.timestamp
        };

        const iframe = document.querySelector('iframe');

        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage(
            gps,
            'https://script.google.com'
          );
        }

        console.log('ACK OPS GPS:', gps);
      },
      function(error) {
        console.error(
          'ACK OPS GPS gagal:',
          error.code,
          error.message
        );
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  }

  window.addEventListener('load', function() {
  const iframe = document.querySelector('iframe');

  if (iframe) {
    iframe.addEventListener('load', function() {
      startPwaGps();
    });
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('ACK OPS Service Worker aktif:', registration.scope);
        })
        .catch(error => {
          console.error('ACK OPS Service Worker gagal:', error);
        });
    });
  }
</script>
  <script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash');

      if (splash) {
        splash.classList.add('hide');

        setTimeout(() => {
          splash.remove();
        }, 300);
      }
    }, 800);
  });
</script>
</body>
</html>
