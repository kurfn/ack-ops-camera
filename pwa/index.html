<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="./manifest.json">

  <title>ACK OPS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbyAgU_mrb5PFtZb9eaTSFzo_7w1OK5mbTRteXTRW6BbcqpRY7i7sr7qOR5Mbj3Gb8o4Tg/exec"
    allow="camera; geolocation"
    allowfullscreen>
  </iframe>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('ACK OPS Service Worker aktif:', registration.scope);
        })
        .catch(error => {
          console.error('ACK OPS Service Worker gagal:', error);
        });
    });
  }
</script>
</body>
</html>
